<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>值日生排班表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #4a5469;
    --muted: #7886a3;
    --line: #d6dbe4;
    --soft: #f7f8fb;
    --soft-2: #eef1f6;
    --panel: #fff;
    --shadow: 0 10px 28px rgba(74,84,105,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6fa;
    color: #333;
    min-height: 100vh;
    padding: 24px 18px;
  }

  .container {
    max-width: 1120px;
    margin: 0 auto;
  }

  .app-shell {
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(214,219,228,0.95);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  /* Editable Title */
  .title-area {
    text-align: center;
    margin-bottom: 6px;
  }

  .title-area h1 {
    font-size: 1.5rem;
    color: var(--ink);
    display: inline-block;
    cursor: pointer;
    border-bottom: 2px dashed transparent;
    transition: border-color 0.2s;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .title-area h1:hover {
    border-bottom-color: #afb7ca;
    background: rgba(74,84,105,0.04);
  }

  .title-area input {
    font-size: 1.6rem;
    font-weight: 700;
    color: #4a5469;
    text-align: center;
    border: 2px solid #4a5469;
    border-radius: 8px;
    padding: 4px 12px;
    outline: none;
    background: #fff;
    width: 320px;
    max-width: 90vw;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 10px;
  }

  .subtitle span {
    border-bottom: 1px dashed transparent;
    border-radius: 4px;
    cursor: pointer;
    display: inline-block;
    padding: 3px 8px;
    transition: background 0.2s, border-color 0.2s;
  }

  .subtitle span:hover {
    background: rgba(74,84,105,0.04);
    border-bottom-color: #afb7ca;
  }

  .subtitle input {
    background: #fff;
    border: 1px solid #afb7ca;
    border-radius: 8px;
    color: #5e687f;
    font-size: 0.9rem;
    outline: none;
    padding: 7px 10px;
    text-align: center;
    width: min(420px, 90vw);
  }

  .sync-status {
    align-items: center;
    color: var(--muted);
    display: flex;
    font-size: 0.76rem;
    gap: 6px;
    justify-content: center;
    margin-bottom: 18px;
  }

  .sync-dot {
    background: #afb7ca;
    border-radius: 50%;
    height: 7px;
    width: 7px;
  }

  .sync-status.online .sync-dot { background: #27ae60; }
  .sync-status.offline .sync-dot { background: #e67e22; }
  .sync-status.syncing .sync-dot { background: #7886a3; }

  /* Members Bar */
  .members-toggle {
    align-items: center;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    font-size: 0.86rem;
    font-weight: 800;
    gap: 7px;
    padding: 9px 12px;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    white-space: nowrap;
  }

  .members-toggle:hover,
  .members-toggle.active {
    background: var(--soft);
    border-color: var(--muted);
    box-shadow: 0 4px 12px rgba(74,84,105,0.08);
  }

  .members-toggle svg,
  .date-icon svg,
  .action-icon {
    display: block;
    height: 17px;
    width: 17px;
  }

  .members-bar {
    display: none;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    margin: -8px auto 20px;
    max-width: 920px;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    flex-wrap: wrap;
  }

  .members-bar.active { display: flex; }

  .member-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid #e7eaf0;
    border-radius: 999px;
    padding: 6px 10px 6px 6px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    transition: box-shadow 0.2s, transform 0.2s;
  }

  .member-chip:hover {
    box-shadow: 0 4px 12px rgba(74,84,105,0.08);
    transform: translateY(-1px);
  }

  .member-chip .chip-dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
  }

  .member-chip .remove-member {
    margin-left: 4px;
    background: #f7f8fb;
    border: none;
    border-radius: 50%;
    color: #afb7ca;
    font-size: 1rem;
    cursor: pointer;
    line-height: 1;
    height: 20px;
    padding: 0;
    transition: color 0.2s;
    width: 20px;
  }

  .member-chip .remove-member:hover { color: #e74c3c; }

  .add-member-btn {
    align-items: center;
    background: #fff;
    border: 1px dashed #afb7ca;
    border-radius: 999px;
    display: inline-flex;
    gap: 6px;
    padding: 7px 12px;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .add-member-btn:hover {
    border-color: #4a5469;
    color: #4a5469;
  }

  .duty-overview {
    display: grid;
    gap: 12px;
    margin: 0 auto 18px;
    max-width: 920px;
  }

  .duty-panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: none;
    padding: 16px;
  }

  .current-panel {
    background: linear-gradient(180deg, #fff 0%, #f7f8fb 100%);
  }

  .duty-panel h2 {
    color: var(--ink);
    font-size: 1rem;
    margin-bottom: 10px;
  }

  .work-panel-head {
    align-items: center;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }

  .work-panel-head-main {
    align-items: center;
    display: flex;
    gap: 8px;
    min-width: 0;
  }

  .collapse-work-btn {
    align-items: center;
    background: var(--soft-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    font-size: 0.9rem;
    font-weight: 900;
    height: 30px;
    justify-content: center;
    line-height: 1;
    width: 30px;
  }

  .collapse-work-btn:hover {
    background: #d6dbe4;
  }

  .work-panel-head h2 {
    margin-bottom: 0;
  }

  .edit-work-btn {
    align-items: center;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: #5e687f;
    cursor: pointer;
    display: inline-flex;
    font-size: 0.78rem;
    font-weight: 800;
    gap: 6px;
    padding: 7px 12px;
  }

  .edit-work-btn:hover {
    background: #eef1f6;
    border-color: #7886a3;
    color: #4a5469;
  }

  .monthly-duty-people {
    align-items: center;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0;
  }

  .monthly-duty-label {
    color: #7886a3;
    font-size: 0.76rem;
    font-weight: 800;
  }

  .monthly-duty-chip {
    align-items: center;
    background: #f7f8fb;
    border: 1px solid #e7eaf0;
    border-radius: 999px;
    color: #4a5469;
    display: inline-flex;
    font-size: 0.82rem;
    font-weight: 800;
    gap: 6px;
    padding: 5px 10px 5px 6px;
  }

  .task-section {
    background: #fff;
    border: 1px solid #eef1f6;
    border-radius: 12px;
    display: grid;
    gap: 12px;
    grid-template-columns: minmax(0, 1fr);
    margin-top: 10px;
    padding: 12px;
  }

  .task-section:first-of-type {
    margin-top: 10px;
  }

  .task-section-head {
    align-items: center;
    display: flex;
    gap: 10px;
    justify-content: space-between;
  }

  .task-section-title {
    align-items: center;
    color: var(--ink);
    display: inline-flex;
    font-size: 0.86rem;
    font-weight: 900;
    gap: 8px;
  }

  .task-icon {
    align-items: center;
    background: var(--soft-2);
    border-radius: 10px;
    color: #5e687f;
    display: inline-flex;
    height: 28px;
    justify-content: center;
    width: 28px;
  }

  .task-section ol,
  .task-section ul {
    color: #4a5469;
    font-size: 0.84rem;
    line-height: 1.62;
    padding-left: 22px;
  }

  .task-section ul {
    list-style: disc;
  }

  .task-section.daily-tasks ol {
    columns: 2;
    column-gap: 28px;
  }

  .task-section li {
    break-inside: avoid;
    margin-bottom: 2px;
  }

  .assignment-stack {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .assignment-card {
    background: #f7f8fb;
    border: 1px solid #e7eaf0;
    border-radius: 12px;
    padding: 12px;
    min-height: 118px;
  }

  .assignment-card.primary {
    border-color: rgba(74,84,105,0.28);
    box-shadow: inset 0 3px 0 #4a5469;
  }

  .assignment-label {
    color: #7886a3;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0;
    margin-bottom: 6px;
  }

  .assignment-person {
    align-items: center;
    color: #4a5469;
    display: flex;
    font-size: 1rem;
    font-weight: 800;
    gap: 8px;
  }

  .assignment-note {
    color: #7886a3;
    font-size: 0.76rem;
    line-height: 1.45;
    margin-top: 6px;
  }

  .tiny-avatar {
    align-items: center;
    border-radius: 50%;
    color: #fff;
    display: inline-flex;
    flex: 0 0 auto;
    font-size: 0.76rem;
    font-weight: 800;
    height: 26px;
    justify-content: center;
    width: 26px;
  }

  .adhoc-btn {
    align-self: flex-end;
    background: #4a5469;
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 800;
    margin-top: 10px;
    max-width: 220px;
    padding: 9px 12px;
    width: 100%;
  }

  .adhoc-btn:hover {
    background: #5e687f;
  }

  .work-task-editor {
    display: grid;
    gap: 12px;
  }

  .modal .work-task-editor label {
    color: #4a5469;
    display: grid;
    font-size: 0.82rem;
    font-weight: 800;
    gap: 6px;
    margin-bottom: 0;
  }

  .modal .work-task-editor textarea {
    border: 1px solid #d6dbe4;
    border-radius: 10px;
    color: #4a5469;
    font: inherit;
    line-height: 1.5;
    min-height: 96px;
    outline: none;
    padding: 10px;
    resize: vertical;
  }

  .work-task-editor textarea:focus {
    border-color: #7886a3;
    box-shadow: 0 0 0 3px rgba(120,134,163,0.16);
  }

  .modal .work-task-editor + .modal-actions {
    margin-top: 18px;
  }

  /* Month Navigation */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 6px auto 12px;
    padding: 8px;
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 16px;
    max-width: 920px;
  }

  .sub-toolbar {
    align-items: center;
    display: flex;
    gap: 12px;
    justify-content: center;
    margin: 0 auto 18px;
    max-width: 920px;
  }

  .secondary-actions {
    display: flex;
    gap: 8px;
  }

  .month-nav button {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    white-space: nowrap;
  }

  .month-nav button:hover {
    background: #5e687f;
    box-shadow: 0 5px 14px rgba(74,84,105,0.14);
    transform: translateY(-1px);
  }

  .month-nav .month-arrow {
    align-items: center;
    display: inline-flex;
    gap: 7px;
    height: 42px;
    justify-content: center;
    min-width: 128px;
  }

  .date-picker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
    min-width: 320px;
    position: relative;
  }

  .date-icon {
    align-items: center;
    background: var(--ink);
    border-radius: 12px;
    color: #fff;
    display: inline-flex;
    flex-shrink: 0;
    height: 42px;
    justify-content: center;
    width: 42px;
    border: none;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
  }

  .date-icon:hover,
  .date-icon.active {
    background: #5e687f;
    box-shadow: 0 4px 12px rgba(74,84,105,0.16);
  }

  .selected-date-pill {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    font-size: 0.92rem;
    font-weight: 800;
    min-width: 220px;
    padding: 10px 18px;
    text-align: center;
    white-space: nowrap;
  }

  .date-popover {
    background: #fff;
    border: 1px solid #d6dbe4;
    border-radius: 14px;
    box-shadow: 0 16px 34px rgba(74,84,105,0.18);
    display: none;
    gap: 8px;
    left: 50%;
    min-width: 330px;
    padding: 12px;
    position: absolute;
    top: calc(100% + 10px);
    transform: translateX(-50%);
    z-index: 50;
  }

  .date-popover.active {
    display: flex;
  }

  .date-select {
    appearance: none;
    background:
      linear-gradient(45deg, transparent 50%, #7886a3 50%) right 12px center / 6px 6px no-repeat,
      linear-gradient(135deg, #7886a3 50%, transparent 50%) right 8px center / 6px 6px no-repeat,
      #fff;
    border: 1px solid #d6dbe4;
    border-radius: 10px;
    color: #4a5469;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 40px;
    outline: none;
    padding: 8px 28px 8px 12px;
  }

  .date-select.year-select {
    min-width: 92px;
  }

  .date-select.month-select,
  .date-select.day-select {
    min-width: 78px;
  }

  .date-select:focus {
    border-color: #7886a3;
    box-shadow: 0 0 0 3px rgba(120,134,163,0.16);
  }

  .month-nav .today-btn {
    align-items: center;
    background: #7886a3;
    display: inline-flex;
    flex-shrink: 0;
    font-size: 0.76rem;
    font-weight: 900;
    height: 42px;
    justify-content: center;
    letter-spacing: 0;
    padding: 10px 12px;
    width: auto;
  }

  .month-nav .today-btn svg { display: none; }

  .reroll-btn {
    align-items: center;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: #5e687f;
    cursor: pointer;
    display: inline-flex;
    font-size: 0.8rem;
    font-weight: 700;
    gap: 6px;
    padding: 10px 12px;
    transition: border-color 0.2s, background 0.2s, color 0.2s, box-shadow 0.2s;
    white-space: nowrap;
  }

  .reroll-btn:hover {
    background: #eef1f6;
    border-color: #7886a3;
    color: #4a5469;
  }

  .preview-switch {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 0;
    padding: 5px;
    width: fit-content;
    max-width: 100%;
    background: var(--soft-2);
    border: 1px solid var(--line);
    border-radius: 12px;
  }

  .preview-switch button {
    border: none;
    border-radius: 8px;
    background: transparent;
    color: #5e687f;
    cursor: pointer;
    font-size: 0.86rem;
    font-weight: 600;
    min-width: 76px;
    padding: 8px 14px;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  }

  .preview-switch button.active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 3px 9px rgba(74,84,105,0.08);
  }

  .preview-note {
    color: #7886a3;
    font-size: 0.82rem;
    margin: -12px auto 18px;
    text-align: center;
  }

  /* Schedule Grid */
  .schedule {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
    margin-bottom: 26px;
  }

  .day-card {
    background: #fff;
    border: 1px solid #e7eaf0;
    border-radius: 12px;
    padding: 14px;
    text-align: left;
    box-shadow: none;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    min-height: 168px;
  }

  .day-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(74,84,105,0.08);
  }

  .day-card.today {
    border-color: var(--ink);
    box-shadow: 0 8px 18px rgba(74,84,105,0.12);
  }

  .day-card.today::before {
    content: "今天";
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 600;
  }

  .day-card .day-name {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    background: #eef1f6;
    color: #5e687f;
    font-size: 0.76rem;
    font-weight: 700;
    padding: 3px 8px;
    margin-bottom: 8px;
  }

  .day-card .day-date {
    color: #4a5469;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 3px;
  }

  .day-card .full-date {
    color: #7886a3;
    font-size: 0.75rem;
    margin-bottom: 14px;
  }

  .day-card .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: #fff;
    font-weight: 700;
  }

  .day-card .person-name {
    font-size: 1rem;
    font-weight: 600;
    color: #4a5469;
    margin-bottom: 4px;
    min-height: 1.3em;
  }

  .day-card .assignment-label {
    color: #7886a3;
    font-size: 0.68rem;
    font-weight: 800;
    margin-top: 8px;
    margin-bottom: 3px;
  }

  .day-card .person-name.secondary-duty {
    color: #5e687f;
    font-size: 0.9rem;
  }

  .day-card .person-name.on-leave {
    text-decoration: line-through;
    color: #afb7ca;
    font-size: 0.85rem;
  }

  .day-card .sub-info {
    font-size: 0.78rem;
    color: #e67e22;
    font-weight: 500;
    margin-bottom: 4px;
  }

  .day-card .actions {
    display: flex;
    gap: 6px;
    justify-content: flex-start;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .day-card .actions button {
    align-items: center;
    display: inline-flex;
    gap: 5px;
    font-size: 0.75rem;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: #5e687f;
    cursor: pointer;
    transition: all 0.2s;
  }

  .day-card .actions button:hover {
    background: #4a5469;
    color: #fff;
    border-color: #4a5469;
  }

  .day-card .actions button.manage-leave {
    color: #7886a3;
  }

  .day-card .actions button.cancel-leave {
    border-color: #e74c3c;
    color: #e74c3c;
  }

  .day-card .actions button.cancel-leave:hover {
    background: #e74c3c;
    color: #fff;
  }

  /* Stats */
  .stats-section h2 {
    font-size: 1.1rem;
    color: #4a5469;
    margin-bottom: 12px;
  }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .section-head h2 {
    margin-bottom: 0;
  }

  .section-note {
    font-size: 0.78rem;
    color: #7886a3;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
    gap: 10px;
    margin-bottom: 28px;
  }

  .stat-card {
    background: #fff;
    border: 1px solid #e7eaf0;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    box-shadow: none;
  }

  .stat-card .stat-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin: 0 auto 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    color: #fff;
    font-weight: 700;
  }

  .stat-card .stat-name {
    font-size: 0.85rem;
    font-weight: 600;
    color: #4a5469;
    margin-bottom: 8px;
  }

  .stat-card .stat-row {
    font-size: 0.75rem;
    color: #7886a3;
    margin-bottom: 3px;
  }

  .stat-card .stat-row span {
    font-weight: 600;
    color: #4a5469;
  }

  .stat-card .owe {
    color: #e74c3c;
    font-weight: 600;
    font-size: 0.8rem;
    margin-top: 4px;
  }

  .stat-card .surplus {
    color: #27ae60;
    font-weight: 600;
    font-size: 0.8rem;
    margin-top: 4px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 100;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 24px 0;
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: #fff;
    border-radius: 16px;
    padding: 22px;
    width: 390px;
    max-width: 92vw;
    margin: auto 0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  }

  .modal h3 {
    font-size: 1rem;
    color: #4a5469;
    margin-bottom: 16px;
  }

  .modal .modal-kicker {
    color: #7886a3;
    font-size: 0.76rem;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .modal .modal-title {
    color: #4a5469;
    font-size: 1.08rem;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .modal .modal-summary {
    background: #f7f8fb;
    border: 1px solid #d6dbe4;
    border-radius: 12px;
    margin-bottom: 16px;
    padding: 12px;
  }

  .modal .summary-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    color: #4a5469;
    font-size: 0.88rem;
    padding: 6px 0;
  }

  .modal .summary-row + .summary-row {
    border-top: 1px solid #e7eaf0;
  }

  .modal .summary-label {
    color: #7886a3;
    flex-shrink: 0;
  }

  .modal .summary-value {
    font-weight: 700;
    text-align: right;
  }

  .modal .modal-help {
    color: #7886a3;
    font-size: 0.82rem;
    line-height: 1.55;
    margin: -4px 0 16px;
  }

  .modal .pick-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  .modal .pick-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid #d6dbe4;
    cursor: pointer;
    transition: all 0.2s;
  }

  .modal .pick-item:hover {
    border-color: #4a5469;
    background: #f7f8fa;
  }

  .modal .pick-item .mini-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    color: #fff;
    font-weight: 700;
    flex-shrink: 0;
  }

  .modal .pick-item .pick-name {
    font-size: 0.9rem;
    font-weight: 500;
    color: #4a5469;
  }

  .modal .pick-item .pick-hint {
    font-size: 0.75rem;
    color: #afb7ca;
    margin-left: auto;
    white-space: nowrap;
  }

  .modal .pick-item.recommended {
    border-color: #7886a3;
    background: #f0f3f8;
  }

  .modal .pick-item.recommended .pick-hint {
    color: #4a5469;
    font-weight: 600;
  }

  .modal .manage-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  .modal .manage-option {
    align-items: center;
    background: #fff;
    border: 1px solid #d6dbe4;
    border-radius: 12px;
    color: #4a5469;
    cursor: pointer;
    display: flex;
    gap: 10px;
    padding: 12px;
    text-align: left;
    transition: background 0.2s, border-color 0.2s;
    width: 100%;
  }

  .modal .manage-option:hover {
    background: #f7f8fb;
    border-color: #7886a3;
  }

  .modal .manage-option .option-icon {
    align-items: center;
    background: #eef1f6;
    border-radius: 10px;
    color: #4a5469;
    display: inline-flex;
    flex: 0 0 34px;
    height: 34px;
    justify-content: center;
    width: 34px;
  }

  .modal .manage-option .option-title {
    display: block;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .modal .manage-option .option-hint {
    color: #7886a3;
    display: block;
    font-size: 0.76rem;
    margin-top: 2px;
  }

  .modal .close-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: #d6dbe4;
    color: #4a5469;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 500;
  }

  .modal .close-btn:hover { background: #afb7ca; }

  .modal .modal-actions {
    display: flex;
    gap: 8px;
  }

  .modal .modal-actions button {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .modal .modal-actions .primary-btn {
    background: #4a5469;
    color: #fff;
  }

  .modal .modal-actions .primary-btn:hover {
    background: #5e687f;
  }

  .modal .modal-actions .danger-btn {
    background: #c0392b;
    color: #fff;
  }

  .modal .modal-actions .danger-btn:hover {
    background: #a93226;
  }

  .modal .modal-actions .secondary-btn {
    background: #d6dbe4;
    color: #4a5469;
  }

  /* Add member modal */
  .modal .add-member-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .modal .add-member-form input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d6dbe4;
    border-radius: 10px;
    font-size: 0.9rem;
    outline: none;
  }

  .modal .add-member-form input:focus {
    border-color: #4a5469;
  }

  .modal .add-member-form button {
    padding: 10px 16px;
    background: #4a5469;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 0.85rem;
    cursor: pointer;
    white-space: nowrap;
  }

  .modal .add-member-form button:hover { background: #5e687f; }

  .modal .color-picker-panel {
    border: 1px solid rgba(175,183,202,0.68);
    background: #f8fafc;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 14px;
  }

  .modal .color-picker-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .modal .color-current {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    border: 1px solid rgba(74,84,105,0.18);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6);
    flex-shrink: 0;
  }

  .modal .color-current-label {
    font-size: 0.75rem;
    color: #7886a3;
    line-height: 1.35;
  }

  .modal .color-current-value {
    color: #4a5469;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
  }

  .modal .color-picker-tools {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 10px;
  }

  .modal .native-color-wrap,
  .modal .hex-color-wrap {
    min-height: 42px;
    border: 1px solid #d6dbe4;
    border-radius: 12px;
    background: #fff;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
  }

  .modal .native-color-wrap span,
  .modal .hex-color-wrap span {
    font-size: 0.78rem;
    color: #7886a3;
    white-space: nowrap;
  }

  .modal .native-color-input {
    width: 32px;
    height: 26px;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .modal .hex-color-input {
    width: 100%;
    min-width: 0;
    border: none;
    outline: none;
    color: #4a5469;
    font-weight: 700;
    background: transparent;
    text-transform: uppercase;
  }

  .modal .add-color-btn {
    min-height: 42px;
    border: none;
    border-radius: 12px;
    background: #4a5469;
    color: #fff;
    font-weight: 700;
    padding: 0 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .modal .add-color-btn:hover { background: #5e687f; }

  .modal .color-picker-error {
    display: none;
    color: #c0392b;
    font-size: 0.78rem;
    margin: -2px 0 8px;
  }

  .modal .color-picker-error.show { display: block; }

  .modal .color-group {
    margin-top: 12px;
  }

  .modal .color-group:first-of-type {
    margin-top: 0;
  }

  .modal .color-group-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    color: #7886a3;
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .modal .custom-color-count {
    color: #7886a3;
    font-size: 0.76rem;
    font-weight: 500;
  }

  .modal .empty-custom-colors {
    color: #9aa5b5;
    background: #fff;
    border: 1px dashed #d6dbe4;
    border-radius: 12px;
    font-size: 0.8rem;
    padding: 10px 12px;
  }

  .modal .color-picks {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(30px, 1fr));
    gap: 8px;
  }

  .modal .color-pick {
    width: 30px;
    height: 30px;
    border-radius: 11px;
    border: 1px solid rgba(74,84,105,0.14);
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    justify-self: center;
    position: relative;
  }

  .modal .color-pick:hover { transform: translateY(-1px); }

  .modal .color-pick.selected {
    border-color: #4a5469;
    box-shadow: 0 0 0 3px rgba(74,84,105,0.16);
  }

  .modal .color-pick.selected::after {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid rgba(74,84,105,0.22);
    position: absolute;
    right: 3px;
    bottom: 3px;
  }

  .modal .custom-color-item {
    position: relative;
    justify-self: center;
    width: 34px;
    height: 34px;
  }

  .modal .custom-color-item .color-pick {
    width: 100%;
    height: 100%;
  }

  .modal .delete-custom-color {
    position: absolute;
    right: -7px;
    top: -7px;
    width: 19px;
    height: 19px;
    border: 2px solid #f8fafc;
    border-radius: 50%;
    background: #fff;
    color: #a93226;
    cursor: pointer;
    display: grid;
    font-size: 0.78rem;
    font-weight: 900;
    line-height: 1;
    place-items: center;
    box-shadow: 0 3px 8px rgba(74,84,105,0.18);
  }

  .modal .delete-custom-color:hover {
    background: #c0392b;
    color: #fff;
  }

  .modal label {
    display: block;
    font-size: 0.8rem;
    color: #7886a3;
    margin-bottom: 6px;
  }

  /* Reset */
  .reset-section {
    text-align: center;
    margin-top: 8px;
  }

  .reset-btn {
    font-size: 0.8rem;
    color: #afb7ca;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  .reset-btn:hover { color: #e74c3c; }

  /* No member warning */
  .no-members {
    text-align: center;
    padding: 40px;
    color: #afb7ca;
    font-size: 1rem;
    grid-column: 1 / -1;
  }

  .empty-state {
    background: #fff;
    border: 1px dashed #afb7ca;
    border-radius: 12px;
    color: #7886a3;
    grid-column: 1 / -1;
    padding: 34px 20px;
    text-align: center;
  }

  /* Calendar View (month) */
  .calendar-view {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 30px;
  }

  .cal-header-cell {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #7886a3;
    padding: 6px 0 4px;
  }

  .cal-cell {
    background: #fff;
    border: 1px solid #e7eaf0;
    border-radius: 12px;
    min-height: 104px;
    padding: 10px 8px 8px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: rgba(74,84,105,0.08);
  }

  .cal-cell:active {
    background: #eef1f6;
  }

  .cal-cell.today {
    border-color: #4a5469;
    border-width: 2px;
    box-shadow: 0 2px 8px rgba(74,84,105,0.15);
  }

  .cal-cell.today::after {
    content: "今天";
    display: block;
    font-size: 0.55rem;
    color: #fff;
    background: #4a5469;
    border-radius: 999px;
    padding: 1px 4px;
    margin: 2px auto 0;
    width: fit-content;
  }

  .cal-cell.empty {
    border: none;
    background: transparent;
    cursor: default;
    min-height: 104px;
  }

  .cal-date {
    display: block;
    font-size: 0.72rem;
    color: #7886a3;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .cal-cell.today .cal-date {
    color: #4a5469;
    font-weight: 700;
  }

  .cal-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    margin: 0 auto 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    color: #fff;
    font-weight: 700;
  }

  .cal-name {
    display: block;
    font-size: 0.76rem;
    color: #4a5469;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cal-name.on-leave {
    text-decoration: line-through;
    color: #afb7ca;
    font-size: 0.68rem;
  }

  .cal-sub {
    display: block;
    font-size: 0.58rem;
    color: #e67e22;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Responsive */
  @media (max-width: 720px) {
    body { padding: 10px; }
    .app-shell { padding: 18px 12px; border-radius: 14px; }
    .title-area h1 { font-size: 1.35rem; }
    .subtitle { font-size: 0.82rem; line-height: 1.45; }
    .month-nav { flex-wrap: wrap; gap: 8px; padding: 8px; }
    .date-picker {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 58px;
      order: -1;
      flex-basis: 100%;
      min-width: 0;
      width: 100%;
    }
    .month-nav > button.month-arrow { flex: 1; }
    .date-icon,
    .month-nav .today-btn { height: 42px; width: 100%; }
    .date-picker .today-btn { flex: 0 0 auto; }
    .selected-date-pill {
      flex: 1;
      font-size: clamp(0.78rem, 3.2vw, 0.9rem);
      min-width: 0;
      overflow: hidden;
      padding: 10px 8px;
      text-align: center;
      text-overflow: ellipsis;
    }
    .date-popover { left: 0; min-width: 100%; right: 0; transform: none; }
    .date-select { flex: 1; min-width: 0; }
    .sub-toolbar { align-items: stretch; flex-direction: column; }
    .secondary-actions { display: flex; }
    .secondary-actions .members-toggle { flex: 1; width: auto; }
    .secondary-actions .reroll-btn { flex: 0 0 82px; }
    .preview-switch { width: 100%; }
    .preview-switch button { flex: 1; min-width: 0; }
    .members-toggle { justify-content: center; width: 100%; }
    .members-bar { margin-top: -4px; }
    .month-nav button { padding: 10px 10px; }
    .month-nav .month-arrow { min-width: 0; }
    .duty-overview { grid-template-columns: 1fr; }
    .calendar-view { gap: 4px; }
    .cal-cell,
    .cal-cell.empty { min-height: 82px; padding: 8px 2px 6px; }
    .cal-avatar { height: 30px; width: 30px; }
    .cal-name { font-size: 0.68rem; }
    .task-section { grid-template-columns: 1fr; }
    .task-section.daily-tasks ol { columns: 1; }
    .task-section-head { align-items: flex-start; flex-direction: column; }
    .task-badge { justify-self: start; }
    .assignment-stack { grid-template-columns: 1fr; }
    .assignment-card { min-height: 0; }
    .adhoc-btn { max-width: none; }
    .schedule { grid-template-columns: repeat(1, 1fr); }
    .section-head { align-items: flex-start; flex-direction: column; }
    .modal .color-picker-tools { grid-template-columns: 1fr; }
    .modal .add-color-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="app-shell">
    <div class="title-area" id="titleArea"></div>
    <p class="subtitle" id="subtitleArea"></p>
    <div class="sync-status offline" id="syncStatus">
      <span class="sync-dot"></span>
      <span id="syncText">單機模式</span>
    </div>

    <div class="month-nav">
      <button class="month-arrow" onclick="changeMonth(-1)" aria-label="上個月">
        <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"></path>
        </svg>
        <span>上個月</span>
      </button>
      <div class="date-picker">
        <button class="date-icon" id="dateToggle" type="button" title="選擇日期" onclick="toggleDatePicker()" aria-expanded="false" aria-controls="datePopover">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"></rect>
            <path d="M16 2v4M8 2v4M3 10h18"></path>
          </svg>
        </button>
        <span class="selected-date-pill" id="selectedDateLabel"></span>
        <div class="date-popover" id="datePopover">
          <select class="date-select year-select" id="yearSelect" onchange="handleDateSelectChange()"></select>
          <select class="date-select month-select" id="monthSelect" onchange="handleDateSelectChange()"></select>
          <select class="date-select day-select" id="daySelect" onchange="handleDateSelectChange(true)"></select>
        </div>
        <button class="today-btn" onclick="goCurrentMonth()" title="回到今天" aria-label="回到今天">
          <span>Today</span>
        </button>
      </div>
      <button class="month-arrow" onclick="changeMonth(1)" aria-label="下個月">
        <span>下個月</span>
        <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
    </div>

    <div class="sub-toolbar">
      <div class="preview-switch" id="previewSwitch" aria-label="排班預覽範圍">
        <button type="button" data-preview="today" onclick="setPreviewMode('today')">當日</button>
        <button type="button" data-preview="week" onclick="setPreviewMode('week')">本週</button>
        <button type="button" data-preview="month" onclick="setPreviewMode('month')">本月</button>
      </div>
      <div class="secondary-actions">
        <button class="members-toggle" id="membersToggle" type="button" onclick="toggleMembersPanel()" aria-expanded="false" aria-controls="membersBar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>成員 <span id="memberCountText"></span></span>
        </button>
        <button class="reroll-btn" onclick="rerollCurrentMonth()" title="重新隨機排班">
          <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-3-6.7"></path>
            <path d="M21 3v6h-6"></path>
          </svg>
          <span>重排</span>
        </button>
      </div>
    </div>

    <div class="members-bar" id="membersBar"></div>
    <div class="duty-overview" id="dutyOverview"></div>
    <div class="preview-note" id="previewNote"></div>

    <div class="schedule" id="schedule"></div>

    <div class="stats-section">
      <div class="section-head">
        <h2>值班統計</h2>
        <span class="section-note" id="statsNote"></span>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="reset-section">
      <button class="reset-btn" onclick="resetAll()">重置所有資料</button>
    </div>
  </div>
</div>

<!-- Modal (shared for substitute picker & add member) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const STORAGE_KEY = 'duty-roster-data';
const API_PATH = '/api/data';
const SYNC_ENABLED = location.protocol === 'http:' || location.protocol === 'https:';
const SYNC_CONFIG = window.DUTY_ROSTER_CONFIG || {};
const SUPABASE_TABLE = SYNC_CONFIG.tableName || 'duty_roster_state';
const SUPABASE_RECORD_ID = SYNC_CONFIG.recordId || 'main';

  },

};

let currentMonthDate = new Date();
currentMonthDate.setDate(1);
currentMonthDate.setHours(0, 0, 0, 0);
let currentViewDate = new Date();
currentViewDate.setHours(0, 0, 0, 0);
let previewMode = 'month';
let membersPanelOpen = false;
let datePickerOpen = false;
let workContentOpen = false;
let data = loadData();
let syncReady = false;
let syncTimer = null;
let isApplyingRemoteData = false;
let remoteDataWasEmpty = false;
let supabaseClient = null;

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    const parsed = JSON.parse(saved);
    // Migrate old format
    if (!parsed.members) {
      return {
        ...DEFAULT_DATA,
        leaves: parsed.leaves || {},
        subs: parsed.subs || {},
        schedules: parsed.schedules || {},
        customColors: normalizeCustomColors(parsed.customColors)
      };
    }
    parsed.colors = parsed.colors || {};
    parsed.leaves = parsed.leaves || {};
    parsed.subs = parsed.subs || {};
    parsed.schedules = parsed.schedules || {};
    parsed.monthlyTaskSchedules = parsed.monthlyTaskSchedules || {};
    parsed.customColors = normalizeCustomColors(parsed.customColors);
    parsed.workTasks = normalizeWorkTasks(parsed.workTasks);
    parsed.members = normalizeMembers(parsed.members);
    if (parsed.scheduleMode !== DEFAULT_DATA.scheduleMode) {
      parsed.schedules = {};
      parsed.monthlyTaskSchedules = {};
      parsed.leaves = {};
      parsed.subs = {};
      parsed.scheduleMode = DEFAULT_DATA.scheduleMode;
    }
    parsed.subtitle = parsed.subtitle || DEFAULT_DATA.subtitle;
    return parsed;
  }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function saveData(options = {}) {
  if (!isApplyingRemoteData) {
    data.updatedAt = Date.now();
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  if (options.remote !== false) queueRemoteSave();
}

function setSyncStatus(state, text) {
  const status = document.getElementById('syncStatus');
  const label = document.getElementById('syncText');
  if (!status || !label) return;
  status.className = `sync-status ${state}`;
  label.textContent = text;
}

function getSupabaseClient() {
  if (supabaseClient) return supabaseClient;
  if (!SYNC_CONFIG.supabaseUrl || !SYNC_CONFIG.supabaseAnonKey || !window.supabase) return null;
  supabaseClient = window.supabase.createClient(SYNC_CONFIG.supabaseUrl, SYNC_CONFIG.supabaseAnonKey);
  return supabaseClient;
}

function getSyncMode() {
  if (!SYNC_ENABLED) return 'local';
  return getSupabaseClient() ? 'supabase' : 'api';
}

function queueRemoteSave() {
  if (!SYNC_ENABLED || !syncReady || isApplyingRemoteData) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushRemoteData, 450);
}

async function pushRemoteData() {
  const syncMode = getSyncMode();
  if (syncMode === 'local') return;
  try {
    setSyncStatus('syncing', '同步中');
    if (syncMode === 'supabase') {
      const client = getSupabaseClient();
      const { error } = await client
        .from(SUPABASE_TABLE)
        .upsert({
          id: SUPABASE_RECORD_ID,
          payload: data,
          updated_at: new Date().toISOString()
        });
      if (error) throw error;
    } else {
      const res = await fetch(API_PATH, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
    }
    setSyncStatus('online', '已同步');
  } catch (err) {
    setSyncStatus('offline', '同步失敗，暫存本機');
  }
}

async function pullRemoteData() {
  const syncMode = getSyncMode();
  if (syncMode === 'local') {
    setSyncStatus('offline', '單機模式');
    return false;
  }

  try {
    setSyncStatus('syncing', '讀取同步資料');
    let remoteData;

    if (syncMode === 'supabase') {
      const client = getSupabaseClient();
      const { data: row, error } = await client
        .from(SUPABASE_TABLE)
        .select('payload, updated_at')
        .eq('id', SUPABASE_RECORD_ID)
        .maybeSingle();
      if (error) throw error;
      remoteData = row?.payload || {};
    } else {
      const res = await fetch(API_PATH, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      remoteData = await res.json();
    }

    remoteDataWasEmpty = !remoteData || Object.keys(remoteData).length === 0;

    if (!remoteDataWasEmpty) {
      const localUpdated = Number(data.updatedAt || 0);
      const remoteUpdated = Number(remoteData.updatedAt || 0);
      if (remoteUpdated >= localUpdated || localUpdated === 0) {
        isApplyingRemoteData = true;
        data = normalizeData(remoteData);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        isApplyingRemoteData = false;
      }
    }

    syncReady = true;
    setSyncStatus('online', syncMode === 'supabase' ? 'Supabase 已同步' : '已同步');
    return true;
  } catch (err) {
    syncReady = false;
    setSyncStatus('offline', '單機模式');
    return false;
  }
}

function normalizeData(raw) {
  const parsed = raw || {};
  const needsScheduleMigration = parsed.scheduleMode !== DEFAULT_DATA.scheduleMode;
  return {
    ...DEFAULT_DATA,
    ...parsed,
    members: normalizeMembers(parsed.members),
    subtitle: parsed.subtitle || DEFAULT_DATA.subtitle,
    colors: parsed.colors || DEFAULT_DATA.colors,
    leaves: needsScheduleMigration ? {} : (parsed.leaves || {}),
    subs: needsScheduleMigration ? {} : (parsed.subs || {}),
    schedules: needsScheduleMigration ? {} : (parsed.schedules || {}),
    monthlyTaskSchedules: needsScheduleMigration ? {} : (parsed.monthlyTaskSchedules || {}),
    customColors: normalizeCustomColors(parsed.customColors),
    workTasks: normalizeWorkTasks(parsed.workTasks),
    scheduleMode: DEFAULT_DATA.scheduleMode
  };
}

function normalizeWorkTasks(tasks = {}) {
  return {
    daily: Array.isArray(tasks.daily) ? tasks.daily : [...DEFAULT_WORK_TASKS.daily],
    monthly: Array.isArray(tasks.monthly) ? tasks.monthly : [...DEFAULT_WORK_TASKS.monthly],
    adhoc: Array.isArray(tasks.adhoc) ? tasks.adhoc : [...DEFAULT_WORK_TASKS.adhoc]
  };
}

function normalizeMembers(members) {
  const list = Array.isArray(members) ? members : DEFAULT_MEMBERS;
  const seen = new Set();
  const normalized = [];
  list.forEach(member => {
    const name = String(member || '').trim();
    if (!name || seen.has(name)) return;
    seen.add(name);
    normalized.push(name);
  });
  return normalized.length ? normalized : [...DEFAULT_MEMBERS];
}

function normalizeHexColor(value) {
  const raw = String(value || '').trim().replace(/^#/, '');
  if (/^[0-9a-fA-F]{3}$/.test(raw)) {
    return `#${raw.split('').map(char => char + char).join('').toUpperCase()}`;
  }
  if (/^[0-9a-fA-F]{6}$/.test(raw)) {
    return `#${raw.toUpperCase()}`;
  }
  return '';
}

function normalizeCustomColors(colors) {
  if (!Array.isArray(colors)) return [];
  const fixed = new Set(PALETTE.map(color => color.toUpperCase()));
  const seen = new Set();
  const normalized = [];
  colors.forEach(color => {
    const hex = normalizeHexColor(color);
    if (!hex || fixed.has(hex) || seen.has(hex)) return;
    seen.add(hex);
    normalized.push(hex);
  });
  return normalized;
}

function getAvailablePalette() {
  const seen = new Set();
  return [...PALETTE, ...(data.customColors || [])].reduce((colors, color) => {
    const hex = normalizeHexColor(color);
    if (!hex || seen.has(hex)) return colors;
    seen.add(hex);
    colors.push(hex);
    return colors;
  }, []);
}

function rememberCustomColor(color) {
  const hex = normalizeHexColor(color);
  if (!hex) return false;
  const before = JSON.stringify(data.customColors || []);
  data.customColors = normalizeCustomColors([...(data.customColors || []), hex]);
  return before !== JSON.stringify(data.customColors);
}

function forgetCustomColor(color) {
  const hex = normalizeHexColor(color);
  if (!hex) return false;
  const before = JSON.stringify(data.customColors || []);
  data.customColors = normalizeCustomColors(data.customColors).filter(customColor => customColor !== hex);
  return before !== JSON.stringify(data.customColors);
}

async function refreshRemoteData() {
  if (!SYNC_ENABLED || !syncReady) return;
  const currentUpdated = Number(data.updatedAt || 0);
  const pulled = await pullRemoteData();
  if (pulled && Number(data.updatedAt || 0) !== currentUpdated) {
    renderAll();
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function encodeInline(value) {
  return encodeURIComponent(String(value));
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function formatShort(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function formatLongDate(d) {
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
}

function formatLongDateWithWeekday(d) {
  const weekday = DAY_NAMES[d.getDay() - 1] || '週末';
  return `${formatLongDate(d)}（${weekday}）`;
}

function parseDateString(dateStr) {
  return new Date(dateStr + 'T00:00:00');
}

function formatMonthInput(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

function formatMonthLabel(d) {
  return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
}

function getMonthKey(d) {
  return formatMonthInput(d);
}

function shuffleList(list) {
  const arr = [...list];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildMonthSchedule(monthDate) {
  const dates = getMonthWeekdays(monthDate);
  const schedule = {};
  const shuffledMembers = shuffleList(data.members);
  const baseCount = Math.floor(dates.length / data.members.length);
  const extraCount = dates.length % data.members.length;
  const remaining = {};
  const lastByWeekday = {};
  let previousPerson = null;

  shuffledMembers.forEach((name, index) => {
    remaining[name] = baseCount + (index < extraCount ? 1 : 0);
  });

  dates.forEach((d) => {
    const weekday = d.getDay();
    let candidates = data.members.filter(name => remaining[name] > 0);

    const avoidSameWeekday = candidates.filter(name => name !== lastByWeekday[weekday]);
    if (avoidSameWeekday.length > 0) candidates = avoidSameWeekday;

    const avoidPreviousDay = candidates.filter(name => name !== previousPerson);
    if (avoidPreviousDay.length > 0) candidates = avoidPreviousDay;

    const maxRemaining = Math.max(...candidates.map(name => remaining[name]));
    candidates = candidates.filter(name => remaining[name] === maxRemaining);

    const person = shuffleList(candidates)[0];
    schedule[formatDate(d)] = person;
    remaining[person]--;
    lastByWeekday[weekday] = person;
    previousPerson = person;
  });

  return schedule;
}

function buildMonthlyTaskAssignees() {
  const counts = {};
  data.members.forEach(name => { counts[name] = 0; });

  Object.values(data.monthlyTaskSchedules || {}).forEach(assignees => {
    (assignees || []).forEach(name => {
      if (counts[name] !== undefined) counts[name]++;
    });
  });

  const selected = [];
  while (selected.length < Math.min(2, data.members.length)) {
    const candidates = data.members.filter(name => !selected.includes(name));
    const minCount = Math.min(...candidates.map(name => counts[name] || 0));
    const person = shuffleList(candidates.filter(name => (counts[name] || 0) === minCount))[0];
    selected.push(person);
    counts[person]++;
  }

  return selected;
}

function getMonthlyTaskAssignees(monthDate = currentMonthDate, force = false) {
  const key = getMonthKey(monthDate);
  const saved = data.monthlyTaskSchedules?.[key];
  const valid = Array.isArray(saved)
    && saved.length === Math.min(2, data.members.length)
    && saved.every(name => data.members.includes(name))
    && new Set(saved).size === saved.length;

  if (force || !valid) {
    data.monthlyTaskSchedules = data.monthlyTaskSchedules || {};
    data.monthlyTaskSchedules[key] = buildMonthlyTaskAssignees();
    saveData();
  }

  return data.monthlyTaskSchedules[key];
}

function scheduleMatchesCurrentMembers(schedule, dates) {
  if (!schedule) return false;
  return dates.every(d => {
    const person = schedule[formatDate(d)];
    return person && data.members.includes(person);
  });
}

function getMonthSchedule(monthDate, force = false) {
  const key = getMonthKey(monthDate);
  const dates = getMonthWeekdays(monthDate);

  if (force || !scheduleMatchesCurrentMembers(data.schedules[key], dates)) {
    data.schedules[key] = buildMonthSchedule(monthDate);
    saveData();
  }

  return data.schedules[key];
}

function getOriginalAssignment(dateStr) {
  if (data.members.length === 0) return null;
  const target = new Date(dateStr + 'T00:00:00');
  const schedule = getMonthSchedule(target);
  return schedule[dateStr] || null;
}

function getMonthWeekdays(monthDate = currentMonthDate) {
  const dates = [];
  const y = monthDate.getFullYear();
  const m = monthDate.getMonth();
  const d = new Date(y, m, 1);

  while (d.getMonth() === m) {
    const dow = d.getDay();
    if (dow >= 1 && dow <= 5) dates.push(new Date(d));
    d.setDate(d.getDate() + 1);
  }

  return dates;
}

function getToday() {
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return now;
}

function setCurrentMonthFromDate(date) {
  currentMonthDate = new Date(date.getFullYear(), date.getMonth(), 1);
  currentViewDate = new Date(date);
  currentViewDate.setHours(0, 0, 0, 0);
}

function getDaysInMonth(year, monthIndex) {
  return new Date(year, monthIndex + 1, 0).getDate();
}

function clampViewDate(year, monthIndex, day) {
  const maxDay = getDaysInMonth(year, monthIndex);
  const safeDay = Math.min(Math.max(day, 1), maxDay);
  return new Date(year, monthIndex, safeDay);
}

function syncDateControls() {
  const yearSelect = document.getElementById('yearSelect');
  const monthSelect = document.getElementById('monthSelect');
  const daySelect = document.getElementById('daySelect');
  const selectedDateLabel = document.getElementById('selectedDateLabel');
  const dateToggle = document.getElementById('dateToggle');
  const datePopover = document.getElementById('datePopover');
  if (!yearSelect || !monthSelect || !daySelect) return;

  const currentYear = getToday().getFullYear();
  const selectedYear = currentViewDate.getFullYear();
  const startYear = Math.min(currentYear - 2, selectedYear - 1);
  const endYear = Math.max(currentYear + 3, selectedYear + 1);

  yearSelect.innerHTML = '';
  for (let year = startYear; year <= endYear; year++) {
    const option = document.createElement('option');
    option.value = String(year);
    option.textContent = `${year} 年`;
    yearSelect.appendChild(option);
  }
  yearSelect.value = String(selectedYear);

  monthSelect.innerHTML = '';
  for (let month = 0; month < 12; month++) {
    const option = document.createElement('option');
    option.value = String(month + 1);
    option.textContent = `${month + 1} 月`;
    monthSelect.appendChild(option);
  }
  monthSelect.value = String(currentViewDate.getMonth() + 1);

  daySelect.innerHTML = '';
  const maxDay = getDaysInMonth(selectedYear, currentViewDate.getMonth());
  for (let day = 1; day <= maxDay; day++) {
    const option = document.createElement('option');
    option.value = String(day);
    option.textContent = `${day} 日`;
    daySelect.appendChild(option);
  }
  daySelect.value = String(currentViewDate.getDate());

  if (selectedDateLabel) selectedDateLabel.textContent = formatLongDateWithWeekday(currentViewDate);
  if (dateToggle) {
    dateToggle.classList.toggle('active', datePickerOpen);
    dateToggle.setAttribute('aria-expanded', datePickerOpen ? 'true' : 'false');
  }
  if (datePopover) datePopover.classList.toggle('active', datePickerOpen);
}

function getCurrentWeekdays() {
  const day = currentViewDate.getDay();
  const monday = new Date(currentViewDate);
  monday.setDate(currentViewDate.getDate() - day + (day === 0 ? -6 : 1));

  const dates = [];
  for (let i = 0; i < 5; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }

  return dates;
}

function getPreviewDates() {
  if (previewMode === 'today') {
    const dow = currentViewDate.getDay();
    return dow >= 1 && dow <= 5 ? [new Date(currentViewDate)] : [];
  }

  if (previewMode === 'week') {
    return getCurrentWeekdays();
  }

  return getMonthWeekdays(currentMonthDate);
}

function renderPreviewSwitch() {
  document.querySelectorAll('#previewSwitch button').forEach(button => {
    button.classList.toggle('active', button.dataset.preview === previewMode);
  });
}

function getPreviewNote(dates) {
  if (previewMode === 'today') {
    return dates.length ? `當日排班：${formatLongDateWithWeekday(dates[0])}` : `${formatLongDateWithWeekday(currentViewDate)} 沒有平日排班`;
  }

  if (previewMode === 'week') {
    return `本週排班：${formatLongDate(dates[0])} 到 ${formatLongDate(dates[dates.length - 1])}`;
  }

  return `${formatMonthLabel(currentMonthDate)} 排班，共 ${dates.length} 個平日`;
}

function isToday(d) {
  const now = new Date();
  return d.toDateString() === now.toDateString();
}

function getColor(name) {
  return data.colors[name] || '#7886a3';
}

function calcStats() {
  const stats = {};
  data.members.forEach(m => {
    stats[m] = { assigned: 0, actual: 0, leave: 0, subbed: 0 };
  });

  if (data.members.length === 0) return stats;

  getMonthWeekdays(currentMonthDate).forEach(d => {
    const ds = formatDate(d);
    const original = getOriginalAssignment(ds);
    if (!original || !stats[original]) return;

    stats[original].assigned++;

    if (data.leaves[ds] === original) {
      stats[original].leave++;
      const sub = data.subs[ds];
      if (sub && stats[sub]) {
        stats[sub].actual++;
        stats[sub].subbed++;
      }
    } else {
      stats[original].actual++;
    }
  });

  return stats;
}

// ─── Title ───
function renderTitle() {
  const area = document.getElementById('titleArea');
  area.innerHTML = `<h1 onclick="editTitle()">${escapeHtml(data.title)}</h1>`;
  document.title = data.title.replace(/[^\w\u4e00-\u9fff]/g, ' ').trim() || '值日生排班表';
}

function renderSubtitle() {
  const area = document.getElementById('subtitleArea');
  area.innerHTML = `<span onclick="editSubtitle()" title="點擊編輯">${escapeHtml(data.subtitle || DEFAULT_DATA.subtitle)}</span>`;
}

function editTitle() {
  const area = document.getElementById('titleArea');
  const input = document.createElement('input');
  input.value = data.title;
  input.maxLength = 40;
  area.innerHTML = '';
  area.appendChild(input);
  input.focus();
  input.select();

  const save = () => {
    const val = input.value.trim();
    if (val) data.title = val;
    saveData();
    renderTitle();
  };

  input.addEventListener('blur', save);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = data.title; input.blur(); }
  });
}

function editSubtitle() {
  const area = document.getElementById('subtitleArea');
  const input = document.createElement('input');
  input.value = data.subtitle || DEFAULT_DATA.subtitle;
  input.maxLength = 60;
  area.innerHTML = '';
  area.appendChild(input);
  input.focus();
  input.select();

  const save = () => {
    const val = input.value.trim();
    if (val) data.subtitle = val;
    saveData();
    renderSubtitle();
  };

  input.addEventListener('blur', save);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = data.subtitle || DEFAULT_DATA.subtitle; input.blur(); }
  });
}

// ─── Members Bar ───
function renderMembersBar() {
  const bar = document.getElementById('membersBar');
  const toggle = document.getElementById('membersToggle');
  const countText = document.getElementById('memberCountText');
  bar.innerHTML = '';
  bar.classList.toggle('active', membersPanelOpen);
  if (toggle) {
    toggle.classList.toggle('active', membersPanelOpen);
    toggle.setAttribute('aria-expanded', membersPanelOpen ? 'true' : 'false');
  }
  if (countText) countText.textContent = `(${data.members.length})`;

  data.members.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'member-chip';
    chip.onclick = () => openEditMemberModal(m);
    chip.innerHTML = `

function removeMember(name) {
  if (data.members.length <= 1) {
    alert('至少要保留一位成員！');
    return;
  }
  if (!confirm(`確定要移除 ${name} 嗎？`)) return;
  data.members = data.members.filter(m => m !== name);
  delete data.colors[name];
  data.schedules = {};
  Object.keys(data.leaves).forEach(dateStr => {
    if (data.leaves[dateStr] === name) delete data.leaves[dateStr];
  });
  Object.keys(data.subs).forEach(dateStr => {
    if (data.subs[dateStr] === name) delete data.subs[dateStr];
  });
  Object.keys(data.monthlyTaskSchedules || {}).forEach(monthKey => {
    const next = data.monthlyTaskSchedules[monthKey].filter(member => member !== name);
    if (next.length === data.monthlyTaskSchedules[monthKey].length) return;
    delete data.monthlyTaskSchedules[monthKey];
  });
  saveData();
  renderAll();
}

function renderColorPicks(containerId, selectedColor, onSelect) {
  const panelEl = document.getElementById(containerId);
  selectedColor = normalizeHexColor(selectedColor) || PALETTE[0];
  panelEl.className = 'color-picker-panel';
  panelEl.innerHTML = `
    <div class="color-picker-head">
      <div class="color-current" data-color-preview></div>
      <div>
        <div class="color-current-label">目前選擇</div>
        <div class="color-current-value" data-color-value>${selectedColor}</div>
      </div>
    </div>
    <div class="color-picker-tools">
      <div class="native-color-wrap">
        <span>選色器</span>
        <input type="color" class="native-color-input" data-native-color value="${selectedColor}">
      </div>
      <div class="hex-color-wrap">
        <span>#</span>
        <input type="text" class="hex-color-input" data-hex-color value="${selectedColor.replace('#', '')}" maxlength="7" placeholder="AABBCC">
      </div>
      <button type="button" class="add-color-btn" data-add-color>新增色票</button>
    </div>
    <div class="color-picker-error" data-color-error>請輸入正確色號，例如 #AABBCC 或 ABC。</div>
    <div class="color-group">
      <div class="color-group-title">
        <span>預設色票</span>
        <span>${PALETTE.length} 色</span>
      </div>
      <div class="color-picks" data-default-color-picks></div>
    </div>
    <div class="color-group">
      <div class="color-group-title">
        <span>自訂色票</span>
        <span class="custom-color-count" data-custom-color-count></span>
      </div>
      <div class="color-picks" data-custom-color-picks></div>
    </div>
  `;

  const previewEl = panelEl.querySelector('[data-color-preview]');
  const valueEl = panelEl.querySelector('[data-color-value]');
  const nativeInput = panelEl.querySelector('[data-native-color]');
  const hexInput = panelEl.querySelector('[data-hex-color]');
  const errorEl = panelEl.querySelector('[data-color-error]');
  const defaultSwatchesEl = panelEl.querySelector('[data-default-color-picks]');
  const customSwatchesEl = panelEl.querySelector('[data-custom-color-picks]');
  const customCountEl = panelEl.querySelector('[data-custom-color-count]');

  function syncSelection(color, shouldNotify = true) {
    const hex = normalizeHexColor(color);
    if (!hex) return false;
    selectedColor = hex;
    previewEl.style.background = hex;
    valueEl.textContent = hex;
    nativeInput.value = hex;
    hexInput.value = hex.replace('#', '');
    errorEl.classList.remove('show');
    panelEl.querySelectorAll('.color-pick').forEach(dot => {
      dot.classList.toggle('selected', dot.dataset.color === hex);
    });
    if (shouldNotify) onSelect(hex);
    return true;
  }

  function renderSwatches() {
    defaultSwatchesEl.innerHTML = '';
    PALETTE.forEach(color => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'color-pick';
      dot.dataset.color = color;
      dot.style.background = color;
      dot.title = color;
      dot.setAttribute('aria-label', `選擇 ${color}`);
      dot.onclick = () => syncSelection(color);
      defaultSwatchesEl.appendChild(dot);
    });

    customSwatchesEl.innerHTML = '';
    const customColors = normalizeCustomColors(data.customColors);
    customCountEl.textContent = customColors.length ? `${customColors.length} 色` : '尚未新增';
    if (!customColors.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-custom-colors';
      empty.textContent = '輸入色號或用選色器挑色，再按新增色票。';
      customSwatchesEl.appendChild(empty);
    } else {
      customColors.forEach(color => {
        const item = document.createElement('div');
        item.className = 'custom-color-item';

        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'color-pick';
        dot.dataset.color = color;
        dot.style.background = color;
        dot.title = `${color}，自訂色票`;
        dot.setAttribute('aria-label', `選擇自訂色票 ${color}`);
        dot.onclick = () => syncSelection(color);

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'delete-custom-color';
        deleteBtn.innerHTML = '&times;';
        deleteBtn.title = `刪除 ${color}`;
        deleteBtn.setAttribute('aria-label', `刪除自訂色票 ${color}`);
        deleteBtn.onclick = e => {
          e.stopPropagation();
          deleteCustomColor(color);
        };

        item.append(dot, deleteBtn);
        customSwatchesEl.appendChild(item);
      });
    }
    syncSelection(selectedColor, false);
  }

  function deleteCustomColor(color) {
    const hex = normalizeHexColor(color);
    if (!hex) return;
    if (!confirm(`確定要刪除自訂色票 ${hex} 嗎？`)) return;
    if (forgetCustomColor(hex)) saveData();
    renderSwatches();
  }

  function addCurrentColor() {
    const hex = normalizeHexColor(hexInput.value || nativeInput.value);
    if (!hex) {
      errorEl.classList.add('show');
      hexInput.focus();
      return;
    }
    rememberCustomColor(hex);
    saveData();
    renderSwatches();
    syncSelection(hex);
  }

  nativeInput.addEventListener('input', () => syncSelection(nativeInput.value));
  hexInput.addEventListener('input', () => {
    const hex = normalizeHexColor(hexInput.value);
    if (hex) syncSelection(hex);
    else errorEl.classList.remove('show');
  });
  hexInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') addCurrentColor();
  });
  panelEl.querySelector('[data-add-color]').addEventListener('click', addCurrentColor);

  renderSwatches();
}

function confirmAddMember() {
  const input = document.getElementById('newMemberName');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  if (data.members.includes(name)) {
    alert(`${name} 已經在名單中了！`);
    input.focus();
    return;
  }
  const color = window._addMemberColor();
  data.members.push(name);
  rememberCustomColor(color);
  data.colors[name] = color;
  data.schedules = {};
  data.monthlyTaskSchedules = {};
  saveData();
  closeModal();
  renderAll();
}

function confirmEditMember(oldName) {
  const input = document.getElementById('editMemberName');
  const newName = input.value.trim();
  if (!newName) { input.focus(); return; }
  if (newName !== oldName && data.members.includes(newName)) {
    alert(`${newName} 已經在名單中了！`);
    input.focus();
    return;
  }

  data.members = data.members.map(member => member === oldName ? newName : member);
  const selectedColor = window._editMemberColor();
  delete data.colors[oldName];
  rememberCustomColor(selectedColor);
  data.colors[newName] = selectedColor;

  Object.keys(data.schedules || {}).forEach(monthKey => {
    Object.keys(data.schedules[monthKey] || {}).forEach(dateStr => {
      if (data.schedules[monthKey][dateStr] === oldName) data.schedules[monthKey][dateStr] = newName;
    });
  });
  Object.keys(data.leaves || {}).forEach(dateStr => {
    if (data.leaves[dateStr] === oldName) data.leaves[dateStr] = newName;
  });
  Object.keys(data.subs || {}).forEach(dateStr => {
    if (data.subs[dateStr] === oldName) data.subs[dateStr] = newName;
  });
  Object.keys(data.monthlyTaskSchedules || {}).forEach(monthKey => {
    data.monthlyTaskSchedules[monthKey] = data.monthlyTaskSchedules[monthKey].map(member => member === oldName ? newName : member);
  });

  saveData();
  closeModal();
  renderAll();
}

function isMobileView() {

function renderCalendarView(container, dates) {
  container.className = 'calendar-view';

  DAY_NAMES.forEach(name => {
    const h = document.createElement('div');
    h.className = 'cal-header-cell';
    h.textContent = name;
    container.appendChild(h);
  });

  const firstDow = dates[0].getDay();
  for (let i = 1; i < firstDow; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell empty';
    container.appendChild(empty);
  }

  dates.forEach(d => {
    const ds = formatDate(d);
    const original = getOriginalAssignment(ds);
    const isOnLeave = data.leaves[ds] === original;
    const sub = data.subs[ds];
    const displayPerson = isOnLeave && sub ? sub : original;
    const today = isToday(d);

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (today ? ' today' : '');
    cell.onclick = () => openDayManage(ds, original);

    let html = `<span class="cal-date">${d.getDate()}</span>`;
    html += `<div class="cal-avatar" style="background:${getColor(displayPerson)}">${escapeHtml(displayPerson ? displayPerson[0] : '?')}</div>`;

    if (isOnLeave && sub) {
      html += `<span class="cal-name on-leave">${escapeHtml(original)}</span>`;
      html += `<span class="cal-sub">→${escapeHtml(sub)}</span>`;
    } else if (isOnLeave && !sub) {
      html += `<span class="cal-name on-leave">${escapeHtml(original)}</span>`;
      html += `<span class="cal-sub">⚠️</span>`;
    } else {
      html += `<span class="cal-name">${escapeHtml(displayPerson)}</span>`;
    }

    cell.innerHTML = html;
    container.appendChild(cell);
  });

  const lastDow = dates[dates.length - 1].getDay();
  for (let i = lastDow + 1; i <= 5; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell empty';
    container.appendChild(empty);
  }
}

function renderSchedule() {
  const dates = getPreviewDates();
  getMonthSchedule(currentMonthDate);
  syncDateControls();
  renderPreviewSwitch();
  renderDutyOverview();
  document.getElementById('previewNote').textContent = getPreviewNote(dates);

  const scheduleEl = document.getElementById('schedule');
  scheduleEl.innerHTML = '';
  scheduleEl.className = 'schedule';

  if (data.members.length === 0) {
    scheduleEl.innerHTML = '<div class="no-members">請先新增成員</div>';
    return;
  }

  if (dates.length === 0) {
    scheduleEl.innerHTML = '<div class="empty-state">選擇的日期不是週一到週五，沒有值日生排班</div>';
    return;
  }

  if (previewMode === 'month') {
    renderCalendarView(scheduleEl, dates);
    return;
  }

  dates.forEach((d) => {
    const ds = formatDate(d);
    const original = getOriginalAssignment(ds);
    const isOnLeave = data.leaves[ds] === original;
    const sub = data.subs[ds];
    const today = isToday(d);

    const card = document.createElement('div');
    card.className = 'day-card' + (today ? ' today' : '');

    const displayPerson = isOnLeave && sub ? sub : original;
    const initial = displayPerson ? displayPerson[0] : '?';

    const actionsHtml = `
      <button class="manage-leave" onclick="openDayManage('${ds}', decodeURIComponent('${encodeInline(original)}'))">
        <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
        </svg>
        <span>管理</span>
      </button>
    `;

    let bodyHtml = '';
    if (isOnLeave && sub) {
      bodyHtml = `
        <div class="person-name on-leave">${escapeHtml(original)}</div>
        <div class="sub-info">代班 → ${escapeHtml(sub)}</div>
      `;
    } else if (isOnLeave && !sub) {
      bodyHtml = `
        <div class="person-name on-leave">${escapeHtml(original)}</div>
        <div class="sub-info">⚠️ 尚未指定代班</div>
      `;
    } else {
      bodyHtml = `<div class="person-name">${escapeHtml(displayPerson)}</div>`;
    }

    card.innerHTML = `
      <div class="day-name">${DAY_NAMES[d.getDay() - 1]}</div>
      <div class="day-date">${formatShort(d)}</div>
      <div class="full-date">${formatLongDate(d)}</div>
      <div class="avatar" style="background:${getColor(displayPerson)}">${escapeHtml(initial)}</div>
      ${bodyHtml}
      <div class="actions">${actionsHtml}</div>
    `;

    scheduleEl.appendChild(card);
  });
}

function renderStats() {
  const stats = calcStats();
  const statsEl = document.getElementById('statsGrid');
  statsEl.innerHTML = '';
  document.getElementById('statsNote').textContent = `${formatMonthLabel(currentMonthDate)}：每日一人，請假代班會反映補班差額`;

  data.members.forEach(m => {
    const s = stats[m];
    if (!s) return;
    const owe = s.assigned - s.actual;
    const card = document.createElement('div');
    card.className = 'stat-card';

    let balanceHtml = '';
    if (owe > 0) {
      balanceHtml = `<div class="owe">欠 ${owe} 次值班</div>`;
    } else if (owe < 0) {
      balanceHtml = `<div class="surplus">多值 ${Math.abs(owe)} 次</div>`;
    }

    card.innerHTML = `
      <div class="stat-avatar" style="background:${getColor(m)}">${escapeHtml(m[0])}</div>
      <div class="stat-name">${escapeHtml(m)}</div>
      <div class="stat-row">應值 <span>${s.assigned}</span></div>

      <div class="stat-row">請假 <span>${s.leave}</span></div>
      <div class="stat-row">代班 <span>${s.subbed}</span></div>
      ${balanceHtml}
    `;

    statsEl.appendChild(card);
  });
}
